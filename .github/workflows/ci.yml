name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: CI never needs to write to the repository, and an
# unset permissions block gives the token more access than this workflow uses.
permissions:
  contents: read

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Validate deployment environment template
        run: bash deploy/native/check-env.sh .env.example

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check backend workspace
        run: cargo check --workspace --all-targets

      - name: Lint backend workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run backend tests
        run: cargo test --workspace --all-targets

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.velismail.online

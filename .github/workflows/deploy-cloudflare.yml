name: Deploy Cloudflare Worker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Wrangler authentication
        run: |
          export CF_API_TOKEN="${{ secrets.CF_API_TOKEN }}"
          npx wrangler whoami || true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set optional frontend origin secret
        if: ${{ secrets.FRONTEND_ORIGIN != '' }}
        run: |
          printf '%s' "${{ secrets.FRONTEND_ORIGIN }}" | npx wrangler secret put FRONTEND_ORIGIN --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set Brevo API key secret
        if: ${{ secrets.BREVO_API_KEY != '' }}
        run: |
          printf '%s' "${{ secrets.BREVO_API_KEY }}" | npx wrangler secret put BREVO_API_KEY --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set primary mail domain secret
        if: ${{ secrets.PRIMARY_MAIL_DOMAIN != '' }}
        run: |
          printf '%s' "${{ secrets.PRIMARY_MAIL_DOMAIN }}" | npx wrangler secret put PRIMARY_MAIL_DOMAIN --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set Brevo sender name secret
        if: ${{ secrets.BREVO_SENDER_NAME != '' }}
        run: |
          printf '%s' "${{ secrets.BREVO_SENDER_NAME }}" | npx wrangler secret put BREVO_SENDER_NAME --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set mail from email secret
        if: ${{ secrets.MAIL_FROM_EMAIL != '' }}
        run: |
          printf '%s' "${{ secrets.MAIL_FROM_EMAIL }}" | npx wrangler secret put MAIL_FROM_EMAIL --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set mail from name secret
        if: ${{ secrets.MAIL_FROM_NAME != '' }}
        run: |
          printf '%s' "${{ secrets.MAIL_FROM_NAME }}" | npx wrangler secret put MAIL_FROM_NAME --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set OTP from email secret
        if: ${{ secrets.OTP_FROM_EMAIL != '' }}
        run: |
          printf '%s' "${{ secrets.OTP_FROM_EMAIL }}" | npx wrangler secret put OTP_FROM_EMAIL --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set allowed sender domains secret
        if: ${{ secrets.ALLOWED_SENDER_DOMAINS != '' }}
        run: |
          printf '%s' "${{ secrets.ALLOWED_SENDER_DOMAINS }}" | npx wrangler secret put ALLOWED_SENDER_DOMAINS --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set OTP signing secret
        if: ${{ secrets.OTP_SIGNING_SECRET != '' }}
        run: |
          printf '%s' "${{ secrets.OTP_SIGNING_SECRET }}" | npx wrangler secret put OTP_SIGNING_SECRET --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set OTP ttl secret
        if: ${{ secrets.OTP_TTL_SECONDS != '' }}
        run: |
          printf '%s' "${{ secrets.OTP_TTL_SECONDS }}" | npx wrangler secret put OTP_TTL_SECONDS --account-id "${{ secrets.CF_ACCOUNT_ID }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: |
          npx wrangler deploy --account-id "${{ secrets.CF_ACCOUNT_ID }}" --api-token "${{ secrets.CF_API_TOKEN }}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

[workspace]
resolver = "2"
members = [
    "services/api-gateway",
    "services/auth-service",
    "services/delivery-engine",
    "services/mail-service",
    "services/storage-service",
    "services/tenant-service",
    "libs/common",
    "libs/crypto",
    "libs/database",
    "libs/external-api",
]

[workspace.package]
version = "3.5.1"
edition = "2021"
authors = ["VelisMail Team"]
license = "MIT"

[workspace.dependencies]
# Core
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["macros", "http2", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
redis = { version = "0.25", features = ["tokio-comp", "cluster"] }

# Crypto & Security
ring = "0.17"
rustls = "0.22"
jsonwebtoken = "9.2"
zeroize = "1.7"

# Mail protocols
lettre = "0.11"
imap = "2.4"

# Storage
aws-sdk-s3 = "1.12"
aws-config = "1.1"

# Queue
async-nats = "0.33"

# Validation
validator = { version = "0.16", features = ["derive"] }
uuid = { version = "1.7", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP utilities
tower-http = { version = "0.5", features = ["trace", "cors", "limit"] }
tower = { version = "0.5", features = ["limit"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Rate limiting
governor = "0.6"

# OpenAPI
utoipa = { version = "4.2", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }



[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "velismail-tenant-service"
version.workspace = true
edition.workspace = true

[lib]
name = "velismail_tenant_service"
path = "src/lib.rs"


[[bin]]
name = "velismail-tenant-service"
path = "src/main.rs"
[dependencies]
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
sqlx.workspace = true
velismail-common = { path = "../../crates/common" }
velismail-database = { path = "../../crates/database" }
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "timeout", "compression-gzip"] }

[dev-dependencies]
proptest = "1.4"

# VelisMail - Production VM deployment
#
# Usage:
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#
# Frontend is deployed separately to Cloudflare Pages.


services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velismail}
      POSTGRES_USER: ${POSTGRES_USER:-velismail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velismail}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 5

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      RUST_LOG: info
      GATEWAY_HOST: 0.0.0.0
      PORT: 3000
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      FRONTEND_URL: ${FRONTEND_URL:-https://velismail.online}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 64 chars random)}
      AUTH_SERVICE_URL: http://auth-service:3001
      MAIL_SERVICE_URL: http://mail-service:3002
      STORAGE_SERVICE_URL: http://storage-service:3003
      TENANT_SERVICE_URL: http://tenant-service:3004
      SECURITY_SERVICE_URL: http://delivery-engine:3005
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  auth-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: auth-service } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      RUST_LOG: info
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-velismail}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_POSTGRES_DB:-velismail_auth}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 64 chars random)}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS:-3600}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-30}
      OTP_SIGNING_SECRET: ${OTP_SIGNING_SECRET:?set OTP_SIGNING_SECRET}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL:-${SMTP_USERNAME}}
      OTP_FROM_NAME: ${OTP_FROM_NAME:-VelisMail}
      PASSKEY_RELYING_PARTY: ${PASSKEY_RELYING_PARTY:-velismail.online}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-https://velismail.online}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-60}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      REQUIRE_MFA: ${REQUIRE_MFA:-false}
      MAX_FAILED_ATTEMPTS: ${MAX_FAILED_ATTEMPTS:-5}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-15}
      FAILED_ATTEMPT_WINDOW_MINUTES: ${FAILED_ATTEMPT_WINDOW_MINUTES:-15}

  mail-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: mail-service } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
    environment:
      RUST_LOG: info
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-velismail}:${POSTGRES_PASSWORD}@postgres:5432/${MAIL_POSTGRES_DB:-velismail_mail}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_CREDS: ${NATS_CREDS:-}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      MAX_ATTACHMENT_SIZE_MB: ${MAX_ATTACHMENT_SIZE_MB:-25}
      UNDO_SEND_WINDOW: ${UNDO_SEND_WINDOW:-30}
      EMAILS_PER_PAGE: ${EMAILS_PER_PAGE:-50}

  storage-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: storage-service } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      RUST_LOG: info
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER:-velismail}:${POSTGRES_PASSWORD}@postgres:5432/${STORAGE_POSTGRES_DB:-velismail_storage}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-velismail}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}

  tenant-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: tenant-service } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      RUST_LOG: info
      PORT: 3004
      DATABASE_URL: postgres://${POSTGRES_USER:-velismail}:${POSTGRES_PASSWORD}@postgres:5432/${TENANT_POSTGRES_DB:-velismail_tenant}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379

  delivery-engine:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: delivery-engine } }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
    environment:
      RUST_LOG: info
      PORT: 3005
      DATABASE_URL: postgres://${POSTGRES_USER:-velismail}:${POSTGRES_PASSWORD}@postgres:5432/${DELIVERY_POSTGRES_DB:-velismail_delivery}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_CREDS: ${NATS_CREDS:-}
      DKIM_PRIVATE_KEY: ${DKIM_PRIVATE_KEY:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-velismail}
      SPF_RECORD: ${SPF_RECORD:-}

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

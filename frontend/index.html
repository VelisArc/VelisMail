    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VelisMail",
        "url": "https://velismail.online",
        "logo": "https://velismail.online/ZeeResizer.png",
        "sameAs": ["https://github.com/VelisArc/VelisMail"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "VelisMail",
        "url": "https://velismail.online",
        "description": "Secure business email operations for custom domains, mail queues, templates, DNS authentication, team access, and audit logs."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VelisMail",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://velismail.online",
        "description": "Secure custom-domain business email platform with team roles, audit logs, templates, mail queue management, and DNS authentication.",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('velismail_theme') || 'light';
          document.documentElement.setAttribute('data-theme', mode);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = mode === 'dark' ? '#121212' : '#ffffff';
        } catch (e) {}
      })();
    </script>
    <style>
      .boot-spinner {
        display: inline-block;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 3px solid rgba(82,82,82,0.18);
        border-top-color: #f59e0b;
        animation: bootSpin 0.8s cubic-bezier(0.55, 0.2, 0.35, 0.85) infinite;
        vertical-align: -0.18em;
      }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation-duration: 1.6s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading-screen" style="position:fixed;inset:0;display:grid;place-items:center;z-index:9999;">
        <div style="display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--bg-elevated,#fff);border:1px solid var(--border-primary,rgba(0,0,0,.08));border-radius:8px;font-family:Manrope,system-ui,sans-serif;color:var(--text-secondary,#525252);font-size:0.88rem;font-weight:700;">
          <span class="boot-spinner"></span>
          <span>Loading</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

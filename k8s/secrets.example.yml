# Copy this file to k8s/secrets.yml for local cluster testing.
# Do not commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: velismail-secrets
  namespace: velismail
type: Opaque
stringData:
  DB_PASSWORD: "replace-me"
  JWT_SECRET: "replace-with-a-long-random-secret"
  S3_ACCESS_KEY: "replace-me"
  S3_SECRET_KEY: "replace-me"
  ENCRYPTION_KEY: "replace-with-32-byte-key-material"
  SMTP_PASSWORD: "replace-me"
  REDIS_PASSWORD: ""

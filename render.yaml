services:
  - type: web
    name: velismail-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.monolith
    envVars:
      # ── Port ──
      - key: PORT
        value: 10000
      # ── Internal service networking ──
      - key: GATEWAY_HOST
        value: 0.0.0.0
      - key: AUTH_HOST
        value: 127.0.0.1
      - key: AUTH_PORT
        value: "3001"
      - key: MAIL_HOST
        value: 127.0.0.1
      - key: MAIL_PORT
        value: "3002"
      - key: STORAGE_HOST
        value: 127.0.0.1
      - key: STORAGE_PORT
        value: "3003"
      - key: TENANT_HOST
        value: 127.0.0.1
      - key: TENANT_PORT
        value: "3004"
      - key: DELIVERY_HOST
        value: 127.0.0.1
      - key: DELIVERY_PORT
        value: "3005"
      # ── Internal service URLs ──
      - key: AUTH_SERVICE_URL
        value: http://127.0.0.1:3001
      - key: MAIL_SERVICE_URL
        value: http://127.0.0.1:3002
      - key: STORAGE_SERVICE_URL
        value: http://127.0.0.1:3003
      - key: TENANT_SERVICE_URL
        value: http://127.0.0.1:3004
      - key: DELIVERY_SERVICE_URL
        value: http://127.0.0.1:3005
      # ── Logging & Domain ──
      - key: RUST_LOG
        value: info
      - key: FRONTEND_URL
        value: https://velismail.online,https://www.velismail.online
      - key: BASE_DOMAIN
        value: velismail.online
      - key: PUBLIC_API_URL
        value: https://api.velismail.online
      - key: VITE_API_URL
        value: https://api.velismail.online
      # ── Auth / JWT ──
      - key: JWT_EXPIRY_SECONDS
        value: "3600"
      - key: REFRESH_TOKEN_EXPIRY_DAYS
        value: "30"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_SESSIONS_PER_USER
        value: "5"
      - key: MAX_FAILED_ATTEMPTS
        value: "5"
      - key: LOCKOUT_DURATION_MINUTES
        value: "15"
      - key: FAILED_ATTEMPT_WINDOW_MINUTES
        value: "15"
      # ── Rate limit ──
      - key: RATE_LIMIT_PER_MINUTE
        value: "100"
      # ── OTP ──
      - key: OTP_TTL_SECONDS
        value: "600"
      # ── Mail ──
      - key: MAX_ATTACHMENT_SIZE_MB
        value: "25"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: UNDO_SEND_WINDOW
        value: "30"
      # ── DKIM / SPF ──
      - key: DKIM_SELECTOR
        value: velismail
      - key: SPF_RECORD
        value: v=spf1 include:_spf.brevo.com include:amazonses.com ~all
      # ── S3 / Backblaze B2 ──
      - key: S3_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: S3_REGION
        value: us-east-005
      - key: S3_BUCKET
        value: velismail
      # ── Database (auto-created from the databases section) ──
      - key: DATABASE_URL
        fromDatabase:
          name: velismail-db
          property: connectionString
      # ── SECRETS — set these manually in Render dashboard after deploy ──
      - key: JWT_SECRET
        sync: false
      - key: OTP_SIGNING_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false
      - key: OTP_FROM_NAME
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: PLATFORM_RESEND_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: DKIM_PRIVATE_KEY
        sync: false

databases:
  - name: velismail-db
    databaseName: velismail
    plan: free
